<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="pn-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="pn-grad-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="100" height="100" rx="24" fill="#0E1322" />
  <rect width="98" height="98" x="1" y="1" rx="23" stroke="url(#pn-grad-primary)" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Outer Nest / Code Brackets -->
  <!-- Left Bracket < -->
  <path d="M 32 38 L 22 50 L 32 62" stroke="url(#pn-grad-primary)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Bracket > -->
  <path d="M 68 38 L 78 50 L 68 62" stroke="url(#pn-grad-primary)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Nest Base Arc -->
  <path d="M 28 66 C 36 78 64 78 72 66" stroke="url(#pn-grad-glow)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Inner Bird / Sprout in the Nest -->
  <path d="M 50 26 C 44 34 40 44 50 56 C 60 44 56 34 50 26 Z" fill="url(#pn-grad-primary)" />
  <circle cx="50" cy="38" r="3" fill="#FFFFFF" />
  
  <!-- Glowing spark / code slash -->
  <line x1="42" y1="62" x2="58" y2="40" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" opacity="0.9" />
</svg>